<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS CV English</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        .a4-paper {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 25px 50px -12px rgb(15 23 42 / 0.15);
            margin: 30px auto;
            padding: 20mm 18mm;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 11.2pt;
            line-height: 1.65;
            color: #1f2937;
            position: relative;
            box-sizing: border-box;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; margin: 0; padding: 0; }
            .preview-wrapper { padding: 0 !important; margin: 0 !important; box-shadow: none !important; }
            .a4-paper {
                width: 210mm !important;
                min-height: 297mm !important;
                margin: 0 !important;
                padding: 20mm 18mm !important;
                box-shadow: none !important;
            }
        }
        @page { size: A4 portrait; margin: 0; }

        .section-title {
            font-size: 13.5pt;
            font-weight: 700;
            color: #1e2937;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 2.5px solid #1e2937;
            letter-spacing: 0.5px;
        }

        .name {
            font-size: 28pt;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #111827;
        }

        .contact-info {
            font-size: 10.8pt;
            color: #374151;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans">

    <!-- NAVBAR -->
    <nav class="bg-slate-950 text-white sticky top-0 z-50 no-print shadow-md">
        <div class="max-w-screen-2xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <i class="fa-solid fa-file-lines text-3xl text-emerald-400"></i>
                <div>
                    <h1 class="text-2xl font-semibold tracking-tight">ATS CV ENGLISH</h1>
                    <p class="text-xs text-slate-400 -mt-0.5">International Version • ATS Optimized</p>
                </div>
            </div>
            
            <div class="flex items-center gap-x-3 text-sm">
                <button onclick="autoSaveDraft()" class="flex items-center gap-x-2 px-5 h-10 bg-white/10 hover:bg-white/20 rounded-2xl font-medium">
                    <i class="fa-solid fa-floppy-disk"></i> <span class="hidden md:inline">Save Draft</span>
                </button>
                <button onclick="saveAsImage()" class="flex items-center gap-x-2 px-5 h-10 bg-violet-600 hover:bg-violet-700 text-white rounded-2xl font-medium">
                    <i class="fa-solid fa-image"></i> <span class="hidden sm:inline">PNG</span>
                </button>
                <button onclick="generatePDF()" class="flex items-center gap-x-2 px-6 h-10 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-medium">
                    <i class="fa-solid fa-file-pdf"></i> <span>PDF ATS</span>
                </button>
                <button onclick="printLetter()" class="flex items-center gap-x-2 px-6 h-10 bg-white text-slate-950 hover:bg-slate-100 rounded-2xl font-medium">
                    <i class="fa-solid fa-print"></i> <span>Print</span>
                </button>
                <button onclick="clearForm()" class="flex items-center justify-center w-10 h-10 text-red-400 hover:text-red-500 rounded-2xl">
                    <i class="fa-solid fa-trash text-xl"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-screen-2xl mx-auto px-6 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- FORM INPUT -->
            <div class="lg:col-span-5 bg-white rounded-3xl shadow-xl p-8 no-print overflow-auto max-h-screen">
                <div class="mb-8">
                    <h2 class="text-2xl font-semibold text-slate-800">ATS CV English Version</h2>
                    <p class="text-emerald-600 text-sm mt-1">Optimized for International Job Applications</p>
                </div>
                
                <div class="space-y-10">
                    <!-- Personal Information -->
                    <div>
                        <h3 class="uppercase text-xs tracking-widest font-medium text-slate-500 mb-4">Personal Information</h3>
                        <input id="nama" type="text" value="Muhammad Hafis" placeholder="Full Name" 
                               class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none mb-4" oninput="updatePreview()">
                        
                        <div class="grid grid-cols-2 gap-4">
                            <input id="phone" type="tel" value="+62 856-1234-5678" placeholder="Phone Number" 
                                   class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none" oninput="updatePreview()">
                            <input id="email" type="email" value="hafis@example.com" placeholder="Email Address" 
                                   class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none" oninput="updatePreview()">
                        </div>
                        <input id="location" type="text" value="Pekalongan, Central Java, Indonesia" placeholder="City, Country" 
                               class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none mt-4" oninput="updatePreview()">
                        <input id="linkedin" type="text" value="linkedin.com/in/hafis" placeholder="LinkedIn / GitHub / Portfolio" 
                               class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none mt-3" oninput="updatePreview()">
                    </div>

                    <!-- Professional Summary -->
                    <div>
                        <h3 class="uppercase text-xs tracking-widest font-medium text-slate-500 mb-4">Professional Summary</h3>
                        <textarea id="summary" rows="5" class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none" 
                                  oninput="updatePreview()">Fresh Graduate in Computer Network and Telecommunications Engineering with strong competencies in IT Support, network administration, and hardware/software troubleshooting. Eager to contribute technical skills in a dynamic international environment.</textarea>
                    </div>

                    <!-- Work Experience -->
                    <div>
                        <h3 class="uppercase text-xs tracking-widest font-medium text-slate-500 mb-3">Work Experience</h3>
                        <div id="experience-container" class="space-y-4"></div>
                        <button onclick="addExperience()" class="mt-3 flex items-center gap-2 text-emerald-600 hover:text-emerald-700 text-sm font-medium">
                            <i class="fa-solid fa-plus"></i> Add Work Experience
                        </button>
                    </div>

                    <!-- Internship Experience -->
                    <div>
                        <h3 class="uppercase text-xs tracking-widest font-medium text-slate-500 mb-3">Internship Experience</h3>
                        <div id="internship-container" class="space-y-4"></div>
                        <button onclick="addInternship()" class="mt-3 flex items-center gap-2 text-emerald-600 hover:text-emerald-700 text-sm font-medium">
                            <i class="fa-solid fa-plus"></i> Add Internship
                        </button>
                    </div>

                    <!-- Education -->
                    <div>
                        <h3 class="uppercase text-xs tracking-widest font-medium text-slate-500 mb-3">Education</h3>
                        <div id="education-container" class="space-y-4"></div>
                        <button onclick="addEducation()" class="mt-3 flex items-center gap-2 text-emerald-600 hover:text-emerald-700 text-sm font-medium">
                            <i class="fa-solid fa-plus"></i> Add Education
                        </button>
                    </div>

                    <!-- Skills -->
                    <div>
                        <h3 class="uppercase text-xs tracking-widest font-medium text-slate-500 mb-4">Skills</h3>
                        <textarea id="skills" rows="6" class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none" 
                                  oninput="updatePreview()">• Microsoft Office Suite (Word, Excel, PowerPoint)
• Computer Network Administration & Configuration
• HTML, CSS, Tailwind CSS, JavaScript
• Hardware & Software Troubleshooting
• Network Device Installation & Maintenance
• English (Intermediate)</textarea>
                    </div>

                    <!-- Certifications & Projects -->
                    <div>
                        <h3 class="uppercase text-xs tracking-widest font-medium text-slate-500 mb-4">Certifications & Projects</h3>
                        <textarea id="certifications" rows="5" class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none" 
                                  oninput="updatePreview()">• Cisco Networking Academy Certificate
• Web-Based School Network Monitoring System (Project)
• Basic Network Security Training</textarea>
                    </div>
                </div>
            </div>

            <!-- PREVIEW -->
            <div class="lg:col-span-7">
                <div class="preview-header flex justify-between items-center mb-4 px-2 no-print">
                    <h3 class="font-semibold text-slate-700 flex items-center gap-x-2">
                        <i class="fa-solid fa-eye"></i> ATS CV Preview (English)
                    </h3>
                    <span class="text-xs bg-emerald-100 text-emerald-700 px-4 py-1.5 rounded-3xl">A4 • ATS Optimized</span>
                </div>
                
                <div class="preview-wrapper bg-white p-6 rounded-3xl shadow-inner overflow-x-auto">
                    <div id="cv" class="a4-paper mx-auto">
                        <div id="cv-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function addExperience() {
            const container = document.getElementById('experience-container');
            const index = container.children.length;
            const div = document.createElement('div');
            div.className = "border border-slate-100 p-5 rounded-2xl space-y-3";
            div.innerHTML = `
                <input type="text" id="exp-job-${index}" placeholder="Job Title" class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none" oninput="updatePreview()">
                <input type="text" id="exp-company-${index}" placeholder="Company Name" class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none" oninput="updatePreview()">
                <input type="text" id="exp-period-${index}" placeholder="Period (e.g. Jan 2025 - Present)" class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none" oninput="updatePreview()">
                <textarea id="exp-desc-${index}" rows="3" placeholder="Key responsibilities and achievements" class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none" oninput="updatePreview()"></textarea>
            `;
            container.appendChild(div);
            updatePreview();
        }

        function addInternship() {
            const container = document.getElementById('internship-container');
            const index = container.children.length;
            const div = document.createElement('div');
            div.className = "border border-slate-100 p-5 rounded-2xl space-y-3";
            div.innerHTML = `
                <input type="text" id="int-job-${index}" placeholder="Internship Title" class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none" oninput="updatePreview()">
                <input type="text" id="int-company-${index}" placeholder="Company / Institution" class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none" oninput="updatePreview()">
                <input type="text" id="int-period-${index}" placeholder="Period" class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none" oninput="updatePreview()">
                <textarea id="int-desc-${index}" rows="3" placeholder="Responsibilities and achievements" class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none" oninput="updatePreview()"></textarea>
            `;
            container.appendChild(div);
            updatePreview();
        }

        function addEducation() {
            const container = document.getElementById('education-container');
            const index = container.children.length;
            const div = document.createElement('div');
            div.className = "border border-slate-100 p-5 rounded-2xl space-y-3";
            div.innerHTML = `
                <input type="text" id="edu-name-${index}" placeholder="Degree & Major / School Name" class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none" oninput="updatePreview()">
                <input type="text" id="edu-year-${index}" placeholder="Year (e.g. 2023 - 2026)" class="w-full px-5 py-4 border border-slate-200 rounded-3xl focus:border-emerald-500 outline-none" oninput="updatePreview()">
            `;
            container.appendChild(div);
            updatePreview();
        }

        function updatePreview() {
            const nama = document.getElementById('nama').value || "Full Name";
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const location = document.getElementById('location').value;
            const linkedin = document.getElementById('linkedin').value;
            const summary = document.getElementById('summary').value;
            const skills = document.getElementById('skills').value;
            const certifications = document.getElementById('certifications').value;

            // Work Experience
            let expHTML = '';
            const expContainer = document.getElementById('experience-container');
            Array.from(expContainer.children).forEach((child, i) => {
                const title = child.querySelector(`#exp-job-${i}`)?.value.trim() || '';
                const company = child.querySelector(`#exp-company-${i}`)?.value.trim() || '';
                const period = child.querySelector(`#exp-period-${i}`)?.value.trim() || '';
                const desc = child.querySelector(`#exp-desc-${i}`)?.value.trim() || '';
                if (title || company) {
                    expHTML += `<div class="mb-7"><p class="font-semibold text-lg">${title} — ${company}</p><p class="text-slate-600 text-sm">${period}</p><div class="mt-3 text-slate-700 whitespace-pre-line">${desc.replace(/\n/g, '<br>')}</div></div>`;
                }
            });

            // Internship
            let intHTML = '';
            const intContainer = document.getElementById('internship-container');
            Array.from(intContainer.children).forEach((child, i) => {
                const title = child.querySelector(`#int-job-${i}`)?.value.trim() || '';
                const company = child.querySelector(`#int-company-${i}`)?.value.trim() || '';
                const period = child.querySelector(`#int-period-${i}`)?.value.trim() || '';
                const desc = child.querySelector(`#int-desc-${i}`)?.value.trim() || '';
                if (title || company) {
                    intHTML += `<div class="mb-7"><p class="font-semibold">${title} — ${company}</p><p class="text-slate-600 text-sm">${period}</p><div class="mt-3 text-slate-700 whitespace-pre-line">${desc.replace(/\n/g, '<br>')}</div></div>`;
                }
            });

            // Education
            let eduHTML = '';
            const eduContainer = document.getElementById('education-container');
            Array.from(eduContainer.children).forEach((child, i) => {
                const name = child.querySelector(`#edu-name-${i}`)?.value.trim() || '';
                const year = child.querySelector(`#edu-year-${i}`)?.value.trim() || '';
                if (name) eduHTML += `<div class="mb-6"><p class="font-semibold">${name}</p><p class="text-slate-600">${year}</p></div>`;
            });

            const contentHTML = `
                <div>
                    <h1 class="name">${nama}</h1>
                    <div class="contact-info mt-3 flex flex-wrap gap-x-5 gap-y-1">
                        <span>${phone}</span>
                        <span>${email}</span>
                        <span>${location}</span>
                        ${linkedin ? `<span class="break-all">${linkedin}</span>` : ''}
                    </div>
                </div>

                ${summary ? `<div class="mt-10"><h2 class="section-title">PROFESSIONAL SUMMARY</h2><p class="text-slate-700 leading-relaxed">${summary}</p></div>` : ''}

                ${expHTML ? `<div class="mt-10"><h2 class="section-title">WORK EXPERIENCE</h2>${expHTML}</div>` : ''}

                ${intHTML ? `<div class="mt-10"><h2 class="section-title">INTERNSHIP EXPERIENCE</h2>${intHTML}</div>` : ''}

                <div class="mt-10"><h2 class="section-title">EDUCATION</h2><div class="mt-4">${eduHTML || '<p class="text-slate-500 italic">Add your education</p>'}</div></div>

                <div class="mt-10"><h2 class="section-title">SKILLS</h2><div class="text-slate-700 whitespace-pre-line leading-relaxed mt-4">${skills.replace(/\n/g, '<br>')}</div></div>

                ${certifications ? `<div class="mt-10"><h2 class="section-title">CERTIFICATIONS & PROJECTS</h2><div class="text-slate-700 whitespace-pre-line leading-relaxed mt-4">${certifications.replace(/\n/g, '<br>')}</div></div>` : ''}
            `;

            document.getElementById('cv-content').innerHTML = contentHTML;
        }

        function printLetter() { updatePreview(); window.print(); }

        function generatePDF() {
            if (confirm('Save as PDF?\n\nTips:\n• Margins = None\n• Check Background graphics')) printLetter();
        }

        function saveAsImage() {
            const cv = document.getElementById('cv');
            html2canvas(cv, { scale: 3, backgroundColor: '#ffffff' }).then(canvas => {
                const link = document.createElement('a');
                link.download = `CV_ATS_${document.getElementById('nama').value.replace(/[^a-zA-Z0-9]/g, '_')}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function autoSaveDraft() {
            alert('Draft saved successfully!');
        }

        function clearForm() {
            if (confirm('Reset all CV data?')) location.reload();
        }

        // Initialize with sample data
        window.onload = () => {
            // Education
            addEducation();
            document.getElementById('edu-name-0').value = "SMK Nurul Ummah Paninggaran – Computer Network and Telecommunications Engineering";
            document.getElementById('edu-year-0').value = "2023 – 2026";

            // Experience
            addExperience();
            document.getElementById('exp-job-0').value = "IT Support Intern";
            document.getElementById('exp-company-0').value = "PT. ABC Technology";
            document.getElementById('exp-period-0').value = "January – March 2025";
            document.getElementById('exp-desc-0').value = "• Performed network maintenance and troubleshooting\n• Installed and configured network devices\n• Developed school website using web technologies";

            // Internship
            addInternship();

            updatePreview();
        };
    </script>
</body>
</html>
